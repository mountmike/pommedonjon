# pommedonjon as a server runs it, and the file to copy into a stack of your
# own. One file for every environment: each environment is a separate stack
# that sets the variables below.
#
#   POMMEDONJON_IMAGE         which build to run
#   POMMEDONJON_BACKUPS_DIR   host directory where backups live
#   POMMEDONJON_USER          uid:gid to run as; must be able to write to the
#                             backups directory (1000:1000)
#   TZ                        where the phones live, e.g. Europe/London
#
# Everything else lives in volumes Docker creates on the first deploy, so
# nothing has to be prepared on the server:
#
#   config    pommedonjon.json
#   secrets   one pair record per phone
#   state     the run history
#
# New volumes are empty: the config and the pair records have to be put into
# theirs once.
#
# A phone must appear in only one environment's config: two daemons watching
# the same phone would each prompt it.

# Names the volumes pommedonjon_config and so on when run with plain
# `docker compose`. A stack manager that sets its own project name overrides it.
name: pommedonjon

services:
  pommedonjon:
    image: ${POMMEDONJON_IMAGE:-ghcr.io/mountmike/pommedonjon:latest}
    restart: unless-stopped
    user: ${POMMEDONJON_USER:-1000:1000}
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - config:/config:ro
      # A pair record grants full access to a phone. Read-only to the app.
      - secrets:/run/secrets:ro
      # The run history (SQLite). On the server's own disk, never a network
      # share.
      - state:/state
      - ${POMMEDONJON_BACKUPS_DIR:?set POMMEDONJON_BACKUPS_DIR}:/backups
    # Only if the config sets api.port, so phones can ask for a backup. It
    # has no authentication yet: publish it on a network you trust.
    # ports:
    #   - "8377:8377"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# Named per stack, so each environment has its own set.
volumes:
  config:
  secrets:
  state:

# Added to compose.yaml by an environment that builds from source instead of
# pulling a published image: the test environment. Deploy with `--build`.
services:
  pommedonjon:
    # The image only exists where it is built. Without this, a "pull images"
    # step before the deploy, which Komodo runs by default, fails looking
    # for it in a registry.
    pull_policy: build
    build:
      context: ..
      args:
        POMMEDONJON_BUILD: ${POMMEDONJON_BUILD:-test}
    # The "back up now" request, for the proof of concept (it has no
    # authentication yet). Only answers if the config sets api.port to 8377.
    ports:
      - "${POMMEDONJON_API_PORT:-8377}:8377"

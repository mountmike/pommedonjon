# Every commit on main becomes an image; a merged "Version Packages" pull
# request becomes a release.
#
#   push to main ──► test ──► release bookkeeping ──► image
#
#   image tags, always:        edge, sha-<commit>
#   image tags, on a release:  <version>, <major>.<minor>, latest
#
# The test environment follows `edge`. Production follows a version.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch at a time, and never cancel one half-way through a
# release.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run inside the same Node image the product ships on, so "passes in
      # CI" and "works in the container" mean the same thing.
      - name: Check under the production Node
        run: |
          docker run --rm -v "$PWD":/app -w /app node:26-alpine sh -ec '
            npm install --global pnpm@12
            pnpm install --frozen-lockfile
            pnpm typecheck
            pnpm test
            pnpm build
          '

  release:
    name: Release bookkeeping
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # The version just released, or empty when this push is not a release.
      version: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Three cases:
      #   changesets are waiting      -> open or update the version pull request
      #   none, and the version in
      #   package.json has no tag yet -> this push is the release
      #   otherwise                   -> nothing to do
      - name: Decide what this push is
        id: plan
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "mode=version" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git tag --list "v$version")" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "release=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the Changesets CLI
        if: steps.plan.outputs.mode == 'version'
        run: |
          npm install --global pnpm@12
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Open or update the version pull request
        if: steps.plan.outputs.mode == 'version'
        uses: changesets/action/version@v2
        with:
          script: pnpm exec changeset version

      # A tag pushed with the workflow's own token does not start another
      # workflow run, which is why the image for a release is built by the
      # next job in this same run and not by a tag trigger.
      - name: Tag the release and publish its notes
        if: steps.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # This version's section of the changelog, without its heading.
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md

  image:
    name: Build and push the image
    needs: [test, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.version != '' }}

      - name: Short commit, for --version
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          # The servers this is deployed to are x86-64. Add linux/arm64 here
          # when someone needs it; it roughly triples the build time.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            POMMEDONJON_BUILD=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Example deployment. Copy to compose.yaml and adjust paths.
#
# The container needs only outbound TCP to each phone on port 62078. It does
# not need host networking, USB, privileges or extra capabilities.
services:
  nightstand:
    build: .
    restart: unless-stopped
    environment:
      # The backup window in the config is read in this timezone. Set it to
      # where the phones live, e.g. Europe/London. Left as UTC, an evening
      # window would open at the wrong hours.
      TZ: Etc/UTC
    volumes:
      # nightstand.json plus pair-records/<udid>.plist. Pair records grant
      # full access to a phone: keep this directory private and read-only.
      - ./config:/config:ro
      - ./state:/state
      # The backup dataset. The container runs as uid 1000 by default; change
      # `user:` below to match the dataset's owner if it differs.
      - /mnt/backups/iphone-backups:/backups
    # user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# Development on your own machine: builds the image from this checkout and
# keeps everything it reads and writes under local/, which git ignores.
#
#   local/dev/state/      the phones, their pair records, settings, history
#   local/dev/backups/    backups
#
# Use it through pnpm, which rebuilds the image when the source has changed:
#
#   pnpm dev probe
#   pnpm dev backup --device <id>
#   pnpm dev report
#   pnpm dev daemon
#
# A phone should only ever be watched by one running daemon. If a server is
# already backing a phone up, do not add that phone here, or stick to
# one-off commands.
# Named here so it does not depend on what the checkout's folder is called.
name: pommedonjon-dev

services:
  pommedonjon:
    build:
      context: .
      args:
        POMMEDONJON_BUILD: dev
    image: pommedonjon:dev
    environment:
      # So `report` shows days and hours as you see them on the wall.
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./local/dev/state:/state
      - ./local/dev/backups:/backups
      # A config file and pair records from before phones were managed in
      # the web app. Brought into the state folder once, if they are there.
      - ./local/dev/config:/config:ro
      - ./local/dev/secrets:/run/secrets:ro
    # The web app, on this machine only. `docker compose run` publishes it
    # only when given --service-ports; `up` always does.
    ports:
      - "127.0.0.1:${POMMEDONJON_PORT:-8377}:8377"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
